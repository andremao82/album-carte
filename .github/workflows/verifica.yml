# Esegue tutti i test a ogni push e a ogni pull request. Su una PR verso main deve essere verde prima del merge:
# il merge su main pubblica il sito (Cloudflare Pages collegato al repository).
name: Verifica
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Preparazione
        run: bash strumenti/setup.sh
      - name: Test
        run: bash strumenti/test.sh
