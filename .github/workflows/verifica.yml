# Esegue tutti i test a ogni push (main escluso: lì li esegue Pubblica) e a ogni pull request.
name: Verifica
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Preparazione
        run: bash strumenti/setup.sh
      - name: Test
        run: bash strumenti/test.sh
