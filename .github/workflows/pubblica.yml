# Pubblicazione automatica su Cloudflare Pages (dal 29/10/2026): a ogni push esegue tutti i test e, se passano,
# carica app/ sul progetto esistente carte-pokemon (indirizzo carte-pokemon-5vf.pages.dev: Cloudflare ha aggiunto -5vf
# perché il nome era già preso; stesso indirizzo = stessi dati sul telefono).
# Push su main → sito online; push su un altro ramo → solo anteprima (https://<ramo>.carte-pokemon-5vf.pages.dev).
# Secret del repository (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN (permesso
# "Cloudflare Pages: Edit") e CLOUDFLARE_ACCOUNT_ID.
name: Pubblica su Cloudflare Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: pubblica-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          bash strumenti/setup.sh
          bash strumenti/test.sh
      - name: Carica su Cloudflare Pages
        # wrangler 4 direttamente (l'azione ufficiale installava la vecchia 3.90). Spazi e a capo tolti dai secret;
        # se il caricamento fallisce, l'errore di Cloudflare diventa un'annotazione leggibile anche senza i log.
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CF_ACCOUNT" | tr -d '[:space:]')"
          # controllo della forma dei secret senza mostrarli: lunghezza e caratteri ammessi
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            val="${!v}"; [[ "$val" =~ ^[A-Za-z0-9_-]+$ ]] && f="caratteri validi" || f="CARATTERI NON VALIDI (copiato altro oltre al valore?)"
            echo "::notice title=$v::${#val} caratteri, $f"
          done
          set +e
          npx --yes wrangler@4 pages deploy app --project-name=carte-pokemon --branch="$GITHUB_REF_NAME" --commit-dirty=true 2>&1 | tee deploy.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error title=Caricamento su Cloudflare non riuscito::$(grep -iE 'error|✘|code' deploy.log | head -6 | tr '\n' ' ' | cut -c1-600)"
          fi
          exit $rc
